[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tuw-study-bot"
version = "0.1.0"
description = "Personal TU Wien study-management bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "python-telegram-bot>=22,<23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
